trainer: baseline
experiment_id: B0
title: Original Stacked-LSTM DQN
description: >
  Paper-style baseline from Untitled Tasks 29–44.
  Softmax outputs + categorical cross-entropy + single network
  Bellman update. Epsilon decays after every replay update.

mode: train
seed: 42

episodes: 31
episode_length: 256
batch_size: 16
gamma: 0.97
replay_capacity: 1000
learning_rate: 0.001

epsilon_start: 1.0
epsilon_min: 0.05
epsilon_decay: 0.996

save_every_episodes: 5
